<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ER:LC Session Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #080a0f;
    color: white;
}

button,
input {
    font: inherit;
}

.screen {
    min-height: 100vh;
}

.auth {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #080a0f;
}

.auth-box {
    width: 420px;
    max-width: 100%;
    background: #11151d;
    border: 1px solid #292f3a;
    border-radius: 18px;
    padding: 30px;
}

.auth-logo {
    font-size: 30px;
    font-weight: 900;
    margin-bottom: 5px;
}

.auth-logo span {
    color: #7557ff;
}

.auth-title {
    font-size: 22px;
    font-weight: 800;
    margin-top: 30px;
}

.input {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    background: #090c12;
    color: white;
    border: 1px solid #303746;
    border-radius: 9px;
    outline: none;
}

.input:focus {
    border-color: #7557ff;
}

.btn {
    border: 0;
    color: white;
    padding: 13px 18px;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
    margin: 4px;
}

.btn:hover {
    opacity: .85;
}

.green {
    background: #26935b;
}

.red {
    background: #d84756;
}

.purple {
    background: #7557ff;
}

.gray {
    background: #292f3a;
}

.auth-buttons {
    margin-top: 15px;
}

.error {
    color: #ff6875;
    min-height: 20px;
    margin-top: 12px;
}

.app {
    min-height: 100vh;
    display: flex;
}

.sidebar {
    width: 240px;
    background: #10131a;
    border-right: 1px solid #292f3a;
    padding: 25px 15px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    padding: 10px 15px 30px;
}

.logo span {
    color: #7557ff;
}

.nav button {
    width: 100%;
    border: 0;
    background: transparent;
    color: #9da5b5;
    padding: 14px;
    margin-bottom: 7px;
    border-radius: 9px;
    text-align: left;
    font-weight: bold;
    cursor: pointer;
}

.nav button:hover {
    background: #202632;
    color: white;
}

.main {
    flex: 1;
    padding: 30px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
}

.top h1 {
    margin: 0;
    font-size: 31px;
}

.muted {
    color: #858e9e;
    font-size: 13px;
}

.user-box {
    display: flex;
    align-items: center;
    gap: 10px;
}

.username {
    background: #151b24;
    padding: 10px 15px;
    border-radius: 20px;
    color: #bbaeff;
}

.status {
    background: #151b24;
    padding: 10px 15px;
    border-radius: 20px;
    color: #70e49b;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.card {
    background: #11151d;
    border: 1px solid #292f3a;
    border-radius: 15px;
    padding: 20px;
}

.card-title {
    color: #858e9e;
    font-size: 12px;
    font-weight: bold;
}

.card-value {
    font-size: 28px;
    font-weight: 900;
    margin-top: 10px;
}

.grid {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 18px;
    margin-top: 18px;
}

.panel {
    background: #11151d;
    border: 1px solid #292f3a;
    border-radius: 15px;
    padding: 20px;
}

.panel h2 {
    margin-top: 0;
}

.check {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
    padding: 13px;
    background: #090c12;
    border: 1px solid #303746;
    border-radius: 9px;
}

.check input {
    width: 18px;
    height: 18px;
}

.activity {
    padding: 12px 0;
    border-bottom: 1px solid #292f3a;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 550px;
    max-width: 100%;
    background: #151a22;
    border: 1px solid #303746;
    border-radius: 15px;
    padding: 25px;
}

.confirm {
    background: #090c12;
    border: 1px solid #303746;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0;
}

.confirm div {
    padding: 9px 0;
    border-bottom: 1px solid #292f3a;
}

.confirm div:last-child {
    border: 0;
}

@media(max-width:900px) {

    .cards,
    .grid {
        grid-template-columns: 1fr;
    }
}

@media(max-width:650px) {

    .sidebar {
        display: none;
    }

    .main {
        padding: 18px;
    }

    .top {
        align-items: flex-start;
        flex-direction: column;
    }
}

</style>

</head>

<body>


<!-- ==============================
     LOGIN / REGISTER
================================ -->

<div
id="authScreen"
class="screen auth">

<div class="auth-box">

<div class="auth-logo">
ER:LC <span>SESSION</span>
</div>

<div class="muted">
Private Session Dashboard
</div>


<div id="loginArea">

<div class="auth-title">
🔑 Login
</div>

<input
id="loginUsername"
class="input"
placeholder="Username"
autocomplete="username">

<input
id="loginPassword"
class="input"
type="password"
placeholder="Password"
autocomplete="current-password">

<div id="loginError" class="error"></div>

<div class="auth-buttons">

<button
class="btn purple"
onclick="login()">

Login

</button>

<button
class="btn gray"
onclick="showRegister()">

Create Account

</button>

</div>

</div>


<div
id="registerArea"
style="display:none;">

<div class="auth-title">
🔐 Create Account
</div>

<input
id="registerUsername"
class="input"
placeholder="Username">

<input
id="registerPassword"
class="input"
type="password"
placeholder="Password">

<input
id="registerConfirm"
class="input"
type="password"
placeholder="Confirm Password">

<div id="registerError" class="error"></div>

<div class="auth-buttons">

<button
class="btn green"
onclick="register()">

Create Account

</button>

<button
class="btn gray"
onclick="showLogin()">

Back to Login

</button>

</div>

</div>

</div>

</div>


<!-- ==============================
     DASHBOARD
================================ -->

<div
id="dashboardScreen"
class="screen"
style="display:none;">

<div class="app">


<aside class="sidebar">

<div class="logo">
SESSION <span>BOT</span>
</div>

<nav class="nav">

<button onclick="showDashboard()">
📊 Dashboard
</button>

<button onclick="openSSU()">
🟢 SSU
</button>

<button onclick="openSSD()">
🔴 SSD
</button>

<button onclick="openVote()">
🗳️ Session Vote
</button>

</nav>

</aside>


<main class="main">


<div class="top">

<div>

<h1>
Session Dashboard
</h1>

<p class="muted">
ER:LC Session Management
</p>

</div>


<div class="user-box">

<div
id="currentUsername"
class="username">
User
</div>

<button
class="btn gray"
onclick="logout()">
Logout
</button>

</div>

</div>


<div class="cards">


<div class="card">

<div class="card-title">
SESSION
</div>

<div
id="sessionStatus"
class="card-value">
Inactive
</div>

</div>


<div class="card">

<div class="card-title">
SERVER CODE
</div>

<div
id="serverCode"
class="card-value">
-
</div>

</div>


<div class="card">

<div class="card-title">
HOST
</div>

<div
id="hostName"
class="card-value">
-
</div>

</div>


</div>


<div class="grid">


<div class="panel">

<h2>
Quick Actions
</h2>

<p class="muted">
You are logged in as the session host account.
</p>

<br>

<button
class="btn green"
onclick="openSSU()">

🟢 START SESSION

</button>


<button
class="btn red"
onclick="openSSD()">

🔴 SHUT SESSION DOWN

</button>


<button
class="btn purple"
onclick="openVote()">

🗳️ SEND SESSION VOTE

</button>

</div>


<div class="panel">

<h2>
Activity
</h2>

<div id="activity">

<div class="muted">
No activity yet.
</div>

</div>

</div>


</div>

</main>

</div>

</div>


<!-- ==============================
     MODAL
================================ -->

<div
id="modal"
class="modal">

<div
id="modalBox"
class="modal-box">
</div>

</div>


<script>


const WORKER_URL =
"https://floral-mouse-7550.j-magdaleno5.workers.dev";


let authToken =
localStorage.getItem("erlc_session_token");

let currentUser = "";

let sessionActive = false;

let serverCode = "";


/*
================================
API
================================
*/

async function api(action, data = {}) {

    const headers = {
        "Content-Type": "application/json"
    };

    if (authToken) {
        headers.Authorization =
            "Bearer " + authToken;
    }

    const response =
        await fetch(WORKER_URL, {

            method: "POST",

            headers,

            body: JSON.stringify({
                action,
                ...data
            })
        });

    const result =
        await response.json();

    if (!response.ok) {
        throw new Error(
            result.error ||
            "Request failed."
        );
    }

    return result;
}


/*
================================
LOGIN
================================
*/

async function login() {

    const username =
        document.getElementById(
            "loginUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const error =
        document.getElementById(
            "loginError"
        );

    error.textContent = "";

    try {

        const result =
            await api("login", {
                username,
                password
            });

        authToken =
            result.token;

        currentUser =
            result.username;

        localStorage.setItem(
            "erlc_session_token",
            authToken
        );

        showDashboardScreen();

    } catch (err) {

        error.textContent =
            err.message;
    }
}


/*
================================
REGISTER
================================
*/

async function register() {

    const username =
        document.getElementById(
            "registerUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "registerPassword"
        ).value;

    const confirm =
        document.getElementById(
            "registerConfirm"
        ).value;

    const error =
        document.getElementById(
            "registerError"
        );

    error.textContent = "";

    if (password !== confirm) {

        error.textContent =
            "Passwords do not match.";

        return;
    }

    try {

        const result =
            await api("register", {
                username,
                password
            });

        authToken =
            result.token;

        currentUser =
            result.username;

        localStorage.setItem(
            "erlc_session_token",
            authToken
        );

        showDashboardScreen();

    } catch (err) {

        error.textContent =
            err.message;
    }
}


/*
================================
LOGOUT
================================
*/

async function logout() {

    try {
        await api("logout");
    } catch {}

    authToken = null;
    currentUser = "";

    localStorage.removeItem(
        "erlc_session_token"
    );

    document.getElementById(
        "dashboardScreen"
    ).style.display = "none";

    document.getElementById(
        "authScreen"
    ).style.display = "flex";
}


/*
================================
CHECK LOGIN
================================
*/

async function checkLogin() {

    if (!authToken) {
        return;
    }

    try {

        const result =
            await api("me");

        currentUser =
            result.username;

        showDashboardScreen();

    } catch {

        localStorage.removeItem(
            "erlc_session_token"
        );

        authToken = null;
    }
}


/*
================================
SHOW DASHBOARD
================================
*/

function showDashboardScreen() {

    document.getElementById(
        "authScreen"
    ).style.display = "none";

    document.getElementById(
        "dashboardScreen"
    ).style.display = "block";

    document.getElementById(
        "currentUsername"
    ).textContent =
        "👤 " + currentUser;

    document.getElementById(
        "hostName"
    ).textContent =
        currentUser;
}


/*
================================
AUTH SCREENS
================================
*/

function showRegister() {

    document.getElementById(
        "loginArea"
    ).style.display = "none";

    document.getElementById(
        "registerArea"
    ).style.display = "block";
}


function showLogin() {

    document.getElementById(
        "registerArea"
    ).style.display = "none";

    document.getElementById(
        "loginArea"
    ).style.display = "block";
}


/*
================================
SEND DISCORD
================================
*/

async function sendDiscord(
    message,
    everyone = false
) {

    try {

        const result =
            await api(
                "discord",
                {
                    message,
                    everyone
                }
            );

        addActivity(
            "✅ Discord announcement sent."
        );

        return result;

    } catch (error) {

        addActivity(
            "❌ Discord announcement failed."
        );

        alert(
            "Discord announcement failed:\n\n" +
            error.message
        );

        throw error;
    }
}


/*
================================
SSU
================================
*/

function openSSU() {

    document.getElementById(
        "modalBox"
    ).innerHTML = `

        <h2>🟢 Start Session</h2>

        <p class="muted">
        Logged-in host:
        <b>${escapeHTML(currentUser)}</b>
        </p>

        <input
            id="ssuCode"
            class="input"
            placeholder="ER:LC Server Code"
        >

        <label class="check">

            <input
                id="ssuEveryone"
                type="checkbox"
            >

            <span>
                📢 Mention @everyone
            </span>

        </label>

        <br>

        <button
            class="btn green"
            onclick="confirmSSU()">
            Continue
        </button>

        <button
            class="btn gray"
            onclick="closeModal()">
            Cancel
        </button>
    `;

    openModal();
}


function confirmSSU() {

    const code =
        document.getElementById(
            "ssuCode"
        ).value.trim();

    const everyone =
        document.getElementById(
            "ssuEveryone"
        ).checked;

    if (!code) {

        alert(
            "Please enter the ER:LC server code."
        );

        return;
    }

    window.pendingSSU = {
        code,
        everyone
    };

    document.getElementById(
        "modalBox"
    ).innerHTML = `

        <h2>⚠️ Confirm SSU</h2>

        <div class="confirm">

            <div>
                <b>Server Code:</b>
                ${escapeHTML(code)}
            </div>

            <div>
                <b>Host:</b>
                ${escapeHTML(currentUser)}
            </div>

            <div>
                <b>@everyone:</b>
                ${everyone ? "YES" : "NO"}
            </div>

        </div>

        <button
            class="btn green"
            onclick="startSSU()">
            ✅ CONFIRM SSU
        </button>

        <button
            class="btn gray"
            onclick="openSSU()">
            ← Back
        </button>
    `;
}


async function startSSU() {

    const data =
        window.pendingSSU;

    const message =
        "🟢 **SESSION STARTED**\n\n" +
        "🎮 **ER:LC Server Code:** `" +
        data.code +
        "`\n\n" +
        "👤 **Host:** " +
        currentUser;

    await sendDiscord(
        message,
        data.everyone
    );

    sessionActive = true;

    serverCode =
        data.code;

    document.getElementById(
        "sessionStatus"
    ).textContent =
        "Active";

    document.getElementById(
        "serverCode"
    ).textContent =
        serverCode;

    document.getElementById(
        "hostName"
    ).textContent =
        currentUser;

    addActivity(
        "🟢 SSU started by " +
        currentUser
    );

    closeModal();
}


/*
================================
SSD
================================
*/

function openSSD() {

    if (!sessionActive) {

        alert(
            "There is no active session."
        );

        return;
    }

    document.getElementById(
        "modalBox"
    ).innerHTML = `

        <h2>🔴 Shut Session Down</h2>

        <div class="confirm">

            <div>
                <b>Server Code:</b>
                ${escapeHTML(serverCode)}
            </div>

            <div>
                <b>Host:</b>
                ${escapeHTML(currentUser)}
            </div>

        </div>

        <button
            class="btn red"
            onclick="confirmSSD()">
            🔴 CONFIRM SSD
        </button>

        <button
            class="btn gray"
            onclick="closeModal()">
            Cancel
        </button>
    `;

    openModal();
}


async function confirmSSD() {

    const message =
        "🔴 **SESSION SHUT DOWN**\n\n" +
        "🎮 **ER:LC Server Code:** `" +
        serverCode +
        "`\n\n" +
        "👤 **Host:** " +
        currentUser;

    await sendDiscord(
        message,
        false
    );

    sessionActive = false;

    serverCode = "";

    document.getElementById(
        "sessionStatus"
    ).textContent =
        "Inactive";

    document.getElementById(
        "serverCode"
    ).textContent =
        "-";

    addActivity(
        "🔴 SSD completed by " +
        currentUser
    );

    closeModal();
}


/*
================================
DISCORD-ONLY VOTE
================================
*/

function openVote() {

    document.getElementById(
        "modalBox"
    ).innerHTML = `

        <h2>🗳️ Session Vote</h2>

        <p class="muted">
        Players will vote in Discord.
        There is no voting on this dashboard.
        </p>

        <div class="confirm">

            <div>
                👍 <b>YES</b> — Vote in Discord
            </div>

            <div>
                👎 <b>NO</b> — Vote in Discord
            </div>

            <div>
                👤 <b>Host:</b>
                ${escapeHTML(currentUser)}
            </div>

        </div>

        <label class="check">

            <input
                id="voteEveryone"
                type="checkbox"
            >

            <span>
                📢 Mention @everyone
            </span>

        </label>

        <br>

        <button
            class="btn purple"
            onclick="sendVote()">
            📢 SEND VOTE TO DISCORD
        </button>

        <button
            class="btn gray"
            onclick="closeModal()">
            Cancel
        </button>
    `;

    openModal();
}


async function sendVote() {

    const everyone =
        document.getElementById(
            "voteEveryone"
        ).checked;

    const message =
        "🗳️ **SESSION VOTE**\n\n" +
        "Should we start an ER:LC session?\n\n" +
        "👍 **YES**\n" +
        "👎 **NO**\n\n" +
        "👤 **Host:** " +
        currentUser +
        "\n\n" +
        "⚠️ Vote using the reactions in Discord.";

    await sendDiscord(
        message,
        everyone
    );

    addActivity(
        "🗳️ Session vote sent by " +
        currentUser
    );

    closeModal();
}


/*
================================
ACTIVITY
================================
*/

function addActivity(text) {

    const box =
        document.getElementById(
            "activity"
        );

    if (
        box.innerText.includes(
            "No activity yet."
        )
    ) {
        box.innerHTML = "";
    }

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "activity";

    item.textContent =
        new Date().toLocaleTimeString() +
        " — " +
        text;

    box.prepend(item);
}


/*
================================
MODAL
================================
*/

function openModal() {

    document.getElementById(
        "modal"
    ).classList.add("show");
}


function closeModal() {

    document.getElementById(
        "modal"
    ).classList.remove("show");
}


function showDashboard() {
    closeModal();
}


/*
================================
ESCAPE HTML
================================
*/

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/*
================================
START
================================
*/

checkLogin();

</script>

</body>
</html>
